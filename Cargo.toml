[workspace]
resolver = "3"
members = ["crates/picocode-core", "crates/picocode-tui", "crates/picocode-gui"]
default-members = ["crates/picocode-tui"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/uthree/picocode"

[workspace.dependencies]
picocode-core = { path = "crates/picocode-core" }

# default-features off to drop rig's aws-lc-rs TLS backend: aws-lc needs
# CMake+NASM on Windows and blocks cross-builds. TLS instead comes from our
# reqwest dep (rustls-no-provider) with the pure-Rust ring provider, which
# the binaries install as the process default at startup.
rig = { version = "0.40", default-features = false, features = ["reqwest", "derive", "rmcp"] }
# MCP client (opt-in via [[mcp_servers]]): stdio child-process servers plus
# streamable-HTTP ones; TLS comes from our process-default ring provider.
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
anyhow = "1"
base64 = "0.22"
thiserror = "2"
regex = "1"
ignore = "0.4"
textwrap = "0.16"
unicode-width = "0.2"
html2text = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "query"] }
toml = "0.9"
url = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false }
arboard = { version = "3.6", features = ["wayland-data-control"] }
png = "0.18"
tempfile = "3"
# Linux sandbox for model-initiated bash commands (kernel LSM, no helper binary)
landlock = "0.4"
unicodeit = "0.2"
rust-i18n = "3"
sys-locale = "0.3"
ratex-render = { version = "0.1.13", features = ["embed-fonts"] }
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-types = "0.1.13"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
