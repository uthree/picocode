[workspace]
resolver = "3"
members = ["crates/picocode-core", "crates/picocode-tui", "crates/picocode-gui"]
default-members = ["crates/picocode-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
picocode-core = { path = "crates/picocode-core" }

rig = "0.40"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
regex = "1"
ignore = "0.4"
textwrap = "0.16"
unicode-width = "0.2"
html2text = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "query"] }
toml = "0.9"
url = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
unicodeit = "0.2"
ratex-render = { version = "0.1.13", features = ["embed-fonts"] }
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-types = "0.1.13"
