[package]
name = "picocode-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A minimal coding agent — native GUI front end"

# Distributed as a bare binary for macOS only: the shell installer's curl
# download carries no quarantine attribute, so Gatekeeper stays out of the
# way. A proper .app bundle (and signing/notarization) would be a separate
# packaging step; Linux needs Vulkan and extra CI deps, Windows gpui
# support is untested — neither is built yet.
[package.metadata.dist]
dist = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
installers = ["shell"]

[[bin]]
name = "picocode-gui"
path = "src/main.rs"

[dependencies]
picocode-core.workspace = true

# For calling core tools directly (the `!` shell escape uses the Bash tool).
rig.workspace = true

# runtime_shaders: compile the Metal shaders at runtime instead of via the
# `metal` CLI, which is only available with a full Xcode install.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# tree-sitter-languages: syntax highlighting inside markdown code blocks.
gpui-component = { version = "0.5", features = ["tree-sitter-languages"] }
# Pinned to the exact version gpui-component uses: its highlighter takes a
# ropey::Rope, so both crates must agree on the type.
ropey = "=2.0.0-beta.1"
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
unicodeit.workspace = true
rust-i18n.workspace = true
ratex-render.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile.workspace = true
