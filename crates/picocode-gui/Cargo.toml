[package]
name = "picocode-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "picocode-gui"
path = "src/main.rs"

[dependencies]
picocode-core.workspace = true

# runtime_shaders: compile the Metal shaders at runtime instead of via the
# `metal` CLI, which is only available with a full Xcode install.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# tree-sitter-languages: syntax highlighting inside markdown code blocks.
gpui-component = { version = "0.5", features = ["tree-sitter-languages"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
unicodeit.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
ratex-render.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
